name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_sign_in: ^6.2.1
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  flutter_launcher_icons: ^0.14.4
  firebase_messaging: ^16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"